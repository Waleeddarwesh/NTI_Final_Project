---
# roles/kubectl/tasks/main.yml
# Install the AWS EKS-vended kubectl binary matching the cluster version (1.34.x).
# The EKS-vended binary is preferred over the upstream Kubernetes binary because
# it guarantees compatibility with EKS-specific API extensions.

- name: Check if kubectl is already installed at correct version
  ansible.builtin.command: kubectl version --client --short
  register: kubectl_installed
  changed_when: false
  failed_when: false
  tags: kubectl

- name: Download kubectl binary
  ansible.builtin.get_url:
    url: "{{ kubectl_url }}"
    dest: /usr/local/bin/kubectl
    mode: '0755'
    owner: root
    group: root
  when: >
    kubectl_installed.rc != 0 or
    kubectl_version not in kubectl_installed.stdout
  tags: kubectl

- name: Verify kubectl version
  ansible.builtin.command: kubectl version --client
  register: kubectl_version_check
  changed_when: false
  tags: kubectl

- name: Display kubectl version
  ansible.builtin.debug:
    msg: "{{ kubectl_version_check.stdout }}"
  tags: kubectl

- name: Configure kubectl for EKS cluster (jenkins user)
  ansible.builtin.command: >
    aws eks update-kubeconfig
    --name {{ eks_cluster_name }}
    --region {{ aws_region }}
    --kubeconfig {{ jenkins_home }}/.kube/config
  become: true
  become_user: "{{ jenkins_user }}"
  register: kubeconfig_update
  changed_when: "'Added new context' in kubeconfig_update.stdout or 'Updated context' in kubeconfig_update.stdout"
  tags: kubectl

- name: Set correct permissions on kubeconfig
  ansible.builtin.file:
    path: "{{ jenkins_home }}/.kube/config"
    owner: "{{ jenkins_user }}"
    group: "{{ jenkins_group }}"
    mode: '0600'
  tags: kubectl
