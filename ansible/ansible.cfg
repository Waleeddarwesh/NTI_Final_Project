[defaults]
inventory          = inventory/hosts.ini
remote_user        = ec2-user
private_key_file   = ~/.ssh/nti-devops-jenkins
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
roles_path         = roles

# Pipelining reduces the number of SSH connections per task, cutting
# execution time significantly on a remote host. Requires that
# requiretty is disabled in /etc/sudoers on the target — AL2023 does
# NOT have requiretty set by default, so this is safe to enable.
pipelining = True

[privilege_escalation]
become       = True
become_method = sudo
become_user  = root

[ssh_connection]
ssh_args       = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path   = /tmp/ansible-%%h-%%r
retries        = 3
