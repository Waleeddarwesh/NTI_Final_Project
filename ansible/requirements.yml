---
# Ansible Galaxy collection requirements.
# Install with: ansible-galaxy collection install -r requirements.yml
#
# community.aws is optional — only needed if you switch from SSH to
# SSM Session Manager as the Ansible connection method.
# See inventory/hosts.ini for instructions.

collections:
  - name: community.general
    version: ">=8.0.0"
  - name: community.aws
    version: ">=7.0.0"
