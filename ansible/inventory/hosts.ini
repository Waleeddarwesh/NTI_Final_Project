# Static inventory — populate JENKINS_IP with the Elastic IP from Terraform:
#   terraform -chdir=../terraform output -raw jenkins_public_ip
#
# Or run the helper script which does this automatically:
#   ./scripts/update-inventory.sh
#
# If using SSM Session Manager instead of SSH, use the instance ID:
#   ansible_host=<instance-id>
#   ansible_connection=aws_ssm
#   (requires community.aws collection: ansible-galaxy collection install community.aws)

[jenkins]
jenkins-host ansible_host=REPLACE_WITH_JENKINS_IP

[jenkins:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/nti-devops-jenkins
