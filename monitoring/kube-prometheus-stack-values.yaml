# monitoring/kube-prometheus-stack-values.yaml
# Values for kube-prometheus-stack v87.10.1
#
# Install command:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm repo update
#   helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring \
#     --create-namespace \
#     --version 87.10.1 \
#     --values monitoring/kube-prometheus-stack-values.yaml

# ── Global ────────────────────────────────────────────────────────────────────
fullnameOverride: kube-prometheus-stack

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    # Retention — 15 days on a 2-node t3.medium cluster is reasonable.
    # Increase once EBS CSI driver is installed and PVs can be resized.
    retention: 15d
    retentionSize: "8GB"

    # Storage — requires EBS CSI driver add-on installed in the cluster.
    # Install: aws eks create-addon --cluster-name nti-devops-dev-eks \
    #            --addon-name aws-ebs-csi-driver
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

    # Scrape additional service monitors in any namespace
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # EKS-specific: kubelet TLS requires insecure skip verify
    # (kubelet certs are signed by the kubelet CA, not the cluster CA)
    kubeletMetrics:
      insecureSkipVerify: true

    # Additional scrape configs — picks up the Django app's /metrics endpoint
    # via the ServiceMonitor defined in monitoring/alerts/servicemonitor.yaml
    additionalScrapeConfigs: []

  # Expose Prometheus UI via NodePort for direct access during development
  service:
    type: ClusterIP

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

  config:
    global:
      resolve_timeout: 5m
      # Slack webhook — replace with real URL before deploying
      slack_api_url: "https://hooks.slack.com/services/REPLACE/WITH/REAL_WEBHOOK"

    route:
      group_by: ["alertname", "namespace", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: "slack-alerts"
      routes:
        # Critical alerts page immediately with shorter repeat
        - matchers:
            - name: severity
              value: critical
          receiver: "slack-critical"
          repeat_interval: 1h

        # Watchdog alert (always fires if Prometheus is working) — silence it
        - matchers:
            - name: alertname
              value: Watchdog
          receiver: "null"

    receivers:
      - name: "null"

      - name: "slack-alerts"
        slack_configs:
          - channel: "#nti-devops-alerts"
            send_resolved: true
            title: |-
              [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
            text: |-
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }}
              *Severity:* {{ .Labels.severity }}
              *Namespace:* {{ .Labels.namespace }}
              *Description:* {{ .Annotations.description }}
              *Started:* {{ .StartsAt | since }}
              {{ end }}

      - name: "slack-critical"
        slack_configs:
          - channel: "#nti-devops-critical"
            send_resolved: true
            title: "🔥 [CRITICAL] {{ .CommonLabels.alertname }}"
            text: |-
              {{ range .Alerts }}
              *Alert:* {{ .Labels.alertname }}
              *Namespace:* {{ .Labels.namespace }}
              *Description:* {{ .Annotations.description }}
              *Runbook:* {{ .Annotations.runbook_url }}
              {{ end }}

    inhibit_rules:
      # If a critical alert fires, suppress the matching warning
      - source_matchers:
          - severity = "critical"
        target_matchers:
          - severity = "warning"
        equal: ["alertname", "namespace"]

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true

  adminPassword: "REPLACE_WITH_SECURE_PASSWORD"   # change before deploying

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistence:
    enabled: true
    storageClassName: gp2
    size: 5Gi

  # Datasources — Prometheus is auto-configured by the chart
  additionalDataSources: []

  # Load custom dashboards from ConfigMaps in the monitoring namespace
  # The dashboards in monitoring/dashboards/ are deployed as ConfigMaps
  # by monitoring/install/dashboards-configmap.yaml
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: monitoring

  # Expose Grafana via LoadBalancer for easy access (dev only)
  # In production, add an Ingress with ALB
  service:
    type: LoadBalancer

  grafana.ini:
    server:
      root_url: "%(protocol)s://%(domain)s/"
    analytics:
      reporting_enabled: false
      check_for_updates: false
    security:
      admin_user: admin

# ── Node Exporter ─────────────────────────────────────────────────────────────
nodeExporter:
  enabled: true

prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 30Mi
    limits:
      cpu: 200m
      memory: 64Mi

# ── kube-state-metrics ────────────────────────────────────────────────────────
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── Prometheus Operator ───────────────────────────────────────────────────────
prometheusOperator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # EKS: control plane metrics are not scraped by default
  # because managed EKS does not expose the control plane endpoints.
  # Disable the scrapers that would fail on managed EKS.
  kubelet:
    enabled: true

# ── Default rules — keep all, they cover K8s cluster health ──────────────────
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false          # EKS manages etcd; not accessible
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: true
    k8sContainerResource: true
    k8sPodOwner: true
    kubeApiserverAvailability: false   # EKS API server; no direct scrape
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubelet: true
    kubeProxy: false          # EKS manages kube-proxy; no direct scrape
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false   # EKS manages scheduler; no direct scrape
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
