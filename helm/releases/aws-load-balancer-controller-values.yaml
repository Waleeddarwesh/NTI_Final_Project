# helm/releases/aws-load-balancer-controller-values.yaml
# Values for the AWS Load Balancer Controller Helm release (chart v3.4.0).
#
# Install command (after creating the IRSA role — see irsa/lbc-irsa.tf):
#
#   # 1. Create the Kubernetes ServiceAccount with IRSA annotation
#   kubectl create serviceaccount aws-load-balancer-controller \
#     -n kube-system \
#     --dry-run=client -o yaml | \
#   kubectl annotate -f - --local \
#     eks.amazonaws.com/role-arn=<LBC_ROLE_ARN> \
#     -o yaml | kubectl apply -f -
#
#   # 2. Install the controller
#   helm repo add eks https://aws.github.io/eks-charts
#   helm repo update
#   helm install aws-load-balancer-controller eks/aws-load-balancer-controller \
#     -n kube-system \
#     --version 3.4.0 \
#     --values helm/releases/aws-load-balancer-controller-values.yaml \
#     --set clusterName=nti-devops-dev-eks

# Cluster name — override with --set clusterName=<actual-cluster-name>
clusterName: nti-devops-dev-eks

# ServiceAccount is created manually above with the IRSA annotation,
# not by the chart — this prevents the chart from creating a SA without
# the required annotation and then the controller failing to assume the role.
serviceAccount:
  create: false
  name: aws-load-balancer-controller

# Run 2 replicas for HA across AZs
replicaCount: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# The controller watches the nti-devops namespace only — reduces blast radius
# if the controller is misconfigured, and improves performance by limiting
# the scope of Ingress/Service events it processes.
# Remove this restriction (or add more namespaces) if other apps need ALB.
watchNamespace: nti-devops

podDisruptionBudget:
  maxUnavailable: 1

# Propagate project tags to every ALB the controller creates
defaultTags:
  Project: nti-devops
  ManagedBy: aws-load-balancer-controller
