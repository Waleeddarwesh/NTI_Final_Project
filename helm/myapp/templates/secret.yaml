---
# Secret values are injected by the Jenkinsfile (Phase 6) from AWS Secrets Manager
# before helm upgrade runs. This template creates/updates the Secret object shape;
# the actual values are populated externally via:
#   kubectl create secret generic ... --dry-run=client -o yaml | kubectl apply -f -
#
# If .Values.secret.secretKey is non-empty (e.g. in CI), values are encoded here.
# In normal operation these will be empty strings (placeholder).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "myapp.fullname" . }}-secret
  namespace: {{ include "myapp.namespace" . }}
  labels:
    {{- include "myapp.labels" . | nindent 4 }}
  annotations:
    # Tells Helm not to manage this secret's data after first creation —
    # prevents helm upgrade from overwriting values written by the Jenkinsfile.
    helm.sh/resource-policy: keep
type: Opaque
data:
  SECRET_KEY: {{ .Values.secret.secretKey | b64enc | quote }}
  DATABASE_URL: {{ .Values.secret.databaseUrl | b64enc | quote }}
  REDIS_URL: {{ .Values.secret.redisUrl | b64enc | quote }}
  DB_PASSWORD: {{ .Values.secret.dbPassword | b64enc | quote }}
