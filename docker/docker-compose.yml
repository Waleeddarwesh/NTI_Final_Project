---
# docker-compose.yml
# Local development stack: Django/Gunicorn + PostgreSQL + Redis + Nginx.
#
# Usage:
#   cp .env.example .env && vi .env       # fill in SECRET_KEY at minimum
#   docker compose up --build             # first run (builds image)
#   docker compose up -d                  # subsequent runs (detached)
#   docker compose logs -f app            # tail application logs
#   docker compose exec app python manage.py createsuperuser
#   docker compose down -v                # stop and remove volumes

version: "3.9"

# ── Shared defaults ───────────────────────────────────────────────────────────
x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
    target: runtime
  env_file: .env
  volumes:
    - staticfiles:/app/staticfiles
    - mediafiles:/app/media
  networks:
    - backend
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       appdb
      POSTGRES_USER:     appuser
      # IMPORTANT: change this before any deployment beyond your laptop.
      # In production this value comes from Secrets Manager (Phase 1/5).
      POSTGRES_PASSWORD: apppassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # ── Application (Gunicorn) ──────────────────────────────────────────────────
  app:
    <<: *app-common
    image: nti-devops/app:local
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Expose only on the internal network — Nginx is the only entry point
    expose:
      - "8000"

  # ── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - mediafiles:/app/media:ro
    ports:
      - "80:80"
    networks:
      - backend
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  staticfiles:
    driver: local
  mediafiles:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  backend:
    driver: bridge
