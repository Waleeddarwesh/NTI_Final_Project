# nginx/nginx.conf
# Nginx reverse proxy for the Django/Gunicorn application.
# In local docker-compose: Nginx listens on port 80, forwards to the
# app container on port 8000.
# In production (Phase 4, Kubernetes): SSL terminates at the AWS ALB /
# Ingress controller — Nginx inside the cluster stays HTTP-only.

upstream django_app {
    # "app" resolves to the app container via Docker's internal DNS.
    # Kubernetes: this becomes the app Service ClusterIP in Phase 4.
    server app:8000;

    # keepalive: reuse connections to Gunicorn instead of opening a new
    # TCP connection per request. 32 is a reasonable value for a
    # moderately loaded single-node deployment.
    keepalive 32;
}

server {
    listen 80;
    server_name _;          # accept any hostname; restrict in production

    client_max_body_size 20M;
    keepalive_timeout 65;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;
    gzip_proxied any;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  nosniff always;
    add_header X-Frame-Options         SAMEORIGIN always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Static files ──────────────────────────────────────────────────────────
    # Served directly by Nginx — never hits Gunicorn.
    # The /app/staticfiles path matches where collectstatic writes in the
    # Dockerfile (and the K8s PV mount in Phase 4).
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Media files ───────────────────────────────────────────────────────────
    # In production (Phase 4) media is served from S3 via django-storages.
    # This block handles local docker-compose dev only.
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Health check endpoint ─────────────────────────────────────────────────
    # Bypasses Nginx for liveness/readiness probes; probes hit Gunicorn
    # directly so Nginx itself being healthy isn't enough to pass the check.
    location /health/ {
        proxy_pass         http://django_app;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        access_log         off;
    }

    # ── Application ───────────────────────────────────────────────────────────
    location / {
        proxy_pass          http://django_app;
        proxy_http_version  1.1;

        # Required for upstream keepalive to work
        proxy_set_header    Connection "";

        # Pass real client info to Django
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;

        # Timeouts — match Gunicorn's --timeout value in entrypoint.sh
        proxy_connect_timeout  10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # Buffer settings — avoids slow client exhausting Gunicorn workers
        proxy_buffering       on;
        proxy_buffer_size     8k;
        proxy_buffers         16 8k;
    }
}
