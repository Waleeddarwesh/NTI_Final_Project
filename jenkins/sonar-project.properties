# sonar-project.properties
# SonarQube project configuration for the nti-devops Django application.
# The Jenkinsfile passes -D flags that override these at pipeline runtime,
# but having this file in the repo means `sonar-scanner` can also be run
# locally without needing to remember all the flags.

sonar.projectKey=nti-devops
sonar.projectName=NTI DevOps Final Project
sonar.projectVersion=1.0

# Source directory — the Django application code
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Exclusions — don't scan generated, vendor, or infra code
sonar.exclusions=\
    **/migrations/**,\
    **/__pycache__/**,\
    **/*.pyc,\
    **/staticfiles/**,\
    **/media/**,\
    **/node_modules/**,\
    helm/**,\
    terraform/**,\
    ansible/**,\
    k8s/**,\
    docker/**,\
    jenkins/**,\
    .git/**

# Python-specific settings
sonar.python.version=3.13

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/tests/**/*.py,**/test_*.py

# Coverage — generated by: python manage.py test with coverage.py
# Run locally: coverage run manage.py test && coverage xml
sonar.python.coverage.reportPaths=coverage.xml

# Duplication threshold — 15% is the SonarQube default
sonar.cpd.python.minimumTokens=100
